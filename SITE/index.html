  <input type="password" id="pw" placeholder="Enter access code" onkeydown="if(event.key==='Enter')check()"/>

</div>

<script>
function check(){
  var pw=document.getElementById('pw').value.trim();
  if(pw==='stlca2026'){window.location.href='START_HERE.html';}
  else{document.getElementById('err').textContent='Incorrect code. Try again.';document.getElementById('pw').value='';document.getElementById('pw').focus();}
}
</script>
