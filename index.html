<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Seattle Housing Enforcement — STLCA</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:system-ui,-apple-system,sans-serif}
  body{
    background:#04070e;
    color:#e9eef7;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    overflow:hidden;
    position:relative;
  }

  /* Sky glow */
  .sky{
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%, rgba(10,30,80,.6), transparent 65%),
      radial-gradient(ellipse 40% 30% at 30% 40%, rgba(45,127,249,.07), transparent 60%),
      radial-gradient(ellipse 40% 30% at 70% 60%, rgba(245,158,11,.05), transparent 60%),
      #04070e;
    z-index:0;
  }

  /* Cityscape SVG container */
  .city{
    position:fixed;
    bottom:0;left:0;right:0;
    height:55%;
    z-index:1;
    pointer-events:none;
  }

  /* Grid lines */
  .grid{
    position:fixed;
    inset:0;
    background:
      repeating-linear-gradient(90deg,transparent,transparent 100px,rgba(45,127,249,.025) 100px,rgba(45,127,249,.025) 101px),
      repeating-linear-gradient(0deg,transparent,transparent 70px,rgba(45,127,249,.018) 70px,rgba(45,127,249,.018) 71px);
    z-index:2;
    pointer-events:none;
  }

  /* Card */
  .wrap{
    position:relative;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:32px;
  }

  /* Logo mark */
  .logo{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .logo-icon{
    display:flex;
    align-items:flex-end;
    gap:3px;
  }
  .logo-icon span{
    display:block;
    background:#2d7ff9;
    border-radius:2px 2px 0 0;
    opacity:.9;
  }
  .logo-wordmark{
    font-size:13px;
    font-weight:800;
    letter-spacing:4px;
    text-transform:uppercase;
    color:#2d7ff9;
  }
  .logo-rule{
    width:40px;
    height:2px;
    background:linear-gradient(90deg,transparent,#2d7ff9,transparent);
    margin-top:2px;
  }

  .card{
    background:rgba(8,14,28,.82);
    border:1px solid rgba(45,127,249,.18);
    border-radius:20px;
    padding:44px 52px 40px;
    max-width:460px;width:90%;
    text-align:center;
    backdrop-filter:blur(16px);
    box-shadow:0 0 0 1px rgba(255,255,255,.04), 0 32px 80px rgba(0,0,0,.6);
  }
  .eyebrow{
    font-size:10px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:2.5px;
    color:rgba(45,127,249,.6);
    margin-bottom:14px;
  }
  h1{
    font-size:28px;
    font-weight:800;
    line-height:1.2;
    margin-bottom:6px;
    letter-spacing:-.3px;
  }
  h1 em{
    font-style:normal;
    color:#2d7ff9;
  }
  .sub{
    font-size:13px;
    color:rgba(233,238,247,.4);
    margin-bottom:32px;
    line-height:1.6;
    margin-top:8px;
  }
  input[type=password]{
    width:100%;
    background:rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.12);
    border-radius:10px;
    padding:14px 16px;
    color:#e9eef7;
    font-size:15px;
    margin-bottom:10px;
    outline:none;
    text-align:center;
    letter-spacing:4px;
    transition:border-color .2s;
  }
  input[type=password]:focus{border-color:rgba(45,127,249,.55);background:rgba(0,0,0,.5)}
  input::placeholder{letter-spacing:1px;color:rgba(233,238,247,.25);font-size:13px}
  button{
    width:100%;
    background:linear-gradient(135deg,#2d7ff9,#1a5fd4);
    color:#fff;border:none;
    border-radius:10px;
    padding:14px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:opacity .2s, transform .1s;
    letter-spacing:.3px;
  }
  button:hover{opacity:.9}
  button:active{transform:scale(.99)}
  .err{color:#ef4444;font-size:12px;margin-top:10px;min-height:18px}

  .footer-note{
    position:relative;z-index:10;
    font-size:10px;
    color:rgba(233,238,247,.18);
    text-align:center;
    letter-spacing:.5px;
  }
</style>
</head>
<body>

<div class="sky"></div>

<div class="grid"></div>

<div class="wrap">

  <!-- LOGO -->
  <div class="logo">
    <div class="logo-icon">
      <span style="width:6px;height:18px"></span>
      <span style="width:8px;height:26px"></span>
      <span style="width:6px;height:34px"></span>
      <span style="width:10px;height:44px"></span>
      <span style="width:6px;height:28px"></span>
      <span style="width:8px;height:20px"></span>
      <span style="width:6px;height:16px"></span>
    </div>
    <div class="logo-wordmark">STLCA</div>
    <div class="logo-rule"></div>
  </div>

  <!-- CARD -->
  <div class="card">
    <div class="eyebrow">Seattle Tenant Landlord Compliance Authority</div>
    <h1>Seattle <em>Housing</em><br>Enforcement</h1>
    <p class="sub">Independent data analysis of SDCI enforcement records.<br>Enter access code to continue.</p>
    <input type="password" id="pw" placeholder="Enter access code" onkeydown="if(event.key==='Enter')check()"/>
    <button onclick="check()">Enter Site</button>
    <div class="err" id="err"></div>
  </div>

</div>

<div class="footer-note" style="margin-top:24px">STLCA &mdash; Public data analysis &mdash; Not legal representation</div>

<script>
function check(){
  var pw=document.getElementById('pw').value.trim();
  if(pw==='stlca2026'){window.location.href='SITE/STLCA_Home.html';}
  else{document.getElementById('err').textContent='Incorrect code. Try again.';document.getElementById('pw').value='';document.getElementById('pw').focus();}
}
</script>
</body>
</html>
